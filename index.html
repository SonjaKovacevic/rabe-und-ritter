<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>Spiel</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --himmel: #cfeaff; --wiese: #b9e3a0; --karte: #ffffff;
    --text: #23324a; --leise: #5d6b80; --rand: #c9d6e6;
    --akzent: #ff8a3d; --akzent-dunkel: #d9692a; --fehler: #b3261e;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    min-height: 100%; margin: 0; padding: 24px 16px;
    display: flex; align-items: center; justify-content: center;
    font-family: "Avenir Next", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: linear-gradient(var(--himmel) 0 65%, var(--wiese) 65% 100%) fixed;
    background-color: var(--himmel);
  }
  main {
    width: min(380px, 100%); padding: 28px 24px 24px; text-align: center;
    background: var(--karte); border-radius: 24px;
    box-shadow: 0 6px 0 rgba(0,0,0,.08), 0 12px 28px rgba(0,0,0,.12);
  }
  .zeichen { font-size: 44px; line-height: 1; margin-bottom: 6px; }
  h1 { font-size: 28px; margin: 0 0 6px; }
  .hinweis { margin: 0 0 20px; color: var(--leise); font-size: 17px; }
  label { display: block; text-align: left; font-weight: 600; font-size: 16px; margin: 0 0 6px; }
  input {
    width: 100%; font: inherit; font-size: 18px; color: var(--text);
    padding: 12px 14px; border: 2px solid var(--rand); border-radius: 14px;
    background: #fbfdff; outline: none;
  }
  input:focus { border-color: var(--akzent); }
  button {
    width: 100%; margin-top: 14px; padding: 14px; border: 0; border-radius: 16px;
    font: inherit; font-size: 20px; font-weight: 700; color: #fff; cursor: pointer;
    background: var(--akzent); box-shadow: 0 4px 0 var(--akzent-dunkel);
  }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--akzent-dunkel); }
  button:disabled { opacity: .6; cursor: default; }
  .meldung { min-height: 1.4em; margin: 14px 0 0; font-size: 16px; font-weight: 600; color: var(--fehler); }
  .meldung.info { font-weight: 400; color: var(--leise); }
  .dreht::before {
    content: ""; display: inline-block; width: .9em; height: .9em; margin-right: .5em; vertical-align: -.12em;
    border: 3px solid var(--rand); border-top-color: var(--akzent); border-radius: 50%;
    animation: drehen .8s linear infinite;
  }
  @keyframes drehen { to { transform: rotate(360deg); } }
  .hinweistext { margin: 0; font-size: 18px; font-weight: 600; }
  .adresse {
    margin: 16px 0 0; padding: 12px 14px; border: 2px dashed var(--rand); border-radius: 14px;
    background: #fbfdff; font-size: 16px; overflow-wrap: anywhere;
    -webkit-user-select: all; user-select: all;
  }
  .technik { margin: 14px 0 0; font-size: 12px; color: var(--leise); overflow-wrap: anywhere; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="zeichen" aria-hidden="true">&#128273;</div>
  <h1>Hallo!</h1>
  <p id="status" class="meldung info dreht" role="status">Moment &hellip;</p>
  <form id="formular" hidden>
    <p class="hinweis">Bitte gib das Passwort ein.</p>
    <label for="passwort">Passwort</label>
    <input id="passwort" name="password" type="password" autocomplete="current-password"
           autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button id="los" type="submit">Los geht's</button>
    <p id="meldung" class="meldung" role="alert"></p>
  </form>
  <section id="kaputt" hidden>
    <p class="hinweistext">Dieser Browser kann das Spiel leider nicht öffnen. Bitte den Link kopieren und in Safari oder Chrome einfügen.</p>
    <p id="adresse" class="adresse"></p>
    <button id="kopieren" type="button">Link kopieren</button>
    <p id="kopiert" class="meldung info" role="status"></p>
    <p id="technik" class="technik"></p>
  </section>
  <noscript><p class="meldung">Bitte JavaScript einschalten.</p></noscript>
</main>
<script>
(() => {
  'use strict';
  const DB = 'spiel-zugang', ABLAGE = 'schluessel', EINTRAG = 'aes';
  // Fristen: Nichts darf ewig warten (eingebaute App-Browser antworten manchmal einfach nie).
  const FRIST_NETZ = 20000, FRIST_DB = 8000, FRIST_SCHLUESSEL = 30000, FRIST_SW = 8000;
  const TEXT = {
    falsch: 'Das Passwort stimmt nicht.',
    netz: 'Keine Verbindung. Bitte später noch einmal versuchen.',
    warten: 'Moment …',
    vergessen: 'Dieses Gerät hat das Passwort vergessen.',
    kopiert: 'Link kopiert. Jetzt Safari oder Chrome öffnen und den Link in die Adresszeile einfügen.',
    markiert: 'Der Link ist markiert. Bitte jetzt kopieren.'
  };
  const $ = id => document.getElementById(id);
  const formular = $('formular'), feld = $('passwort'), knopf = $('los'), meldung = $('meldung'), status = $('status');
  const ADRESSE = new URL('./', location.href).href;

  const nurStatus = (text, info) => { formular.hidden = true; $('kaputt').hidden = true; status.hidden = false; status.textContent = text; status.classList.toggle('info', !!info); status.classList.remove('dreht'); };
  const setzeMeldung = (text, info, dreht) => { meldung.textContent = text || ''; meldung.classList.toggle('info', !!info); meldung.classList.toggle('dreht', !!dreht); };
  const zeigeFormular = (text, info) => { status.hidden = true; $('kaputt').hidden = true; formular.hidden = false; setzeMeldung(text, info); feld.focus(); };

  // --- Hinweis statt Einfrieren: Link zum Kopieren für Safari oder Chrome ---
  const zeigeKaputt = detail => {
    status.hidden = true; formular.hidden = true; $('kaputt').hidden = false;
    const adresse = $('adresse');                          // Umbruch bevorzugt nach "/" (<wbr> wird nicht mitkopiert)
    adresse.textContent = '';
    (ADRESSE.match(/[^\/]*\/+|[^\/]+$/g) || [ADRESSE]).forEach((teil, i) => {
      if (i) adresse.appendChild(document.createElement('wbr'));
      adresse.appendChild(document.createTextNode(teil));
    });
    $('technik').textContent = detail ? 'Technischer Hinweis: ' + String(detail).slice(0, 200) : '';
  };
  const markiere = () => {
    try { const r = document.createRange(), s = getSelection(); r.selectNodeContents($('adresse')); s.removeAllRanges(); s.addRange(r); } catch (e) {}
  };
  $('kopieren').addEventListener('click', async () => {
    markiere();
    let geklappt = false;
    try { await mitFrist(navigator.clipboard.writeText(ADRESSE), 3000, 'Zwischenablage'); geklappt = true; }
    catch (e) { try { geklappt = document.execCommand('copy'); } catch (e2) {} }
    $('kopiert').textContent = geklappt ? TEXT.kopiert : TEXT.markiert;
  });

  class Netzfehler extends Error {}
  class Browserfehler extends Error {}
  const mitFrist = (versprechen, ms, was) => new Promise((ok, fehler) => {
    const uhr = setTimeout(() => fehler(new Browserfehler(was + ': keine Antwort (Zeitlimit)')), ms);
    Promise.resolve(versprechen).then(w => { clearTimeout(uhr); ok(w); }, e => { clearTimeout(uhr); fehler(e); });
  });
  // Ein Schritt, der hängen oder werfen kann: wird zu Browserfehler mit kurzer Beschreibung.
  const schritt = async (was, ms, tun) => {
    try { return await mitFrist(tun(), ms, was); }
    catch (e) {
      if (e instanceof Browserfehler || e instanceof Netzfehler) throw e;
      throw new Browserfehler(was + ': ' + (e && e.name ? e.name + (e.message ? ' – ' + e.message : '') : String(e)));
    }
  };
  const zeigeFehler = e => {
    console.error(e);
    if (e instanceof Netzfehler) nurStatus(TEXT.netz);
    else zeigeKaputt(e instanceof Browserfehler ? e.message : String((e && e.message) || e));
  };

  // --- Schlüsselablage (IndexedDB; der Schlüssel selbst ist nicht auslesbar) ---
  const oeffne = () => new Promise((ok, fehler) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(ABLAGE);
    r.onsuccess = () => ok(r.result);
    r.onerror = () => fehler(r.error);
  });
  const ablage = (modus, tun) => schritt('Speicher (IndexedDB)', FRIST_DB, async () => {
    const db = await oeffne();
    try {
      return await new Promise((ok, fehler) => {
        const t = db.transaction(ABLAGE, modus), a = tun(t.objectStore(ABLAGE));
        t.oncomplete = () => ok(a.result);
        t.onerror = t.onabort = () => fehler(t.error);
      });
    } finally { db.close(); }
  });
  const lies = () => ablage('readonly', s => s.get(EINTRAG));
  const speichere = wert => ablage('readwrite', s => s.put(wert, EINTRAG));
  const loesche = () => ablage('readwrite', s => s.delete(EINTRAG));
  const meldeSW = async () => {
    try {
      const reg = await mitFrist(navigator.serviceWorker.getRegistration('./'), 3000, 'Service Worker');
      if (reg && reg.active) reg.active.postMessage({ typ: 'zugang-geaendert' });
    } catch (e) {}
  };

  // --- Netz und Krypto ---
  const lade = async (adresse, art) => {
    try {
      return await mitFrist(fetch(adresse, { cache: 'no-cache' }).then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r[art]();
      }), FRIST_NETZ, adresse);
    } catch (e) { throw new Netzfehler(); }
  };
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  let pruefDaten = null;
  const pruefe = async schluessel => {
    if (!pruefDaten) pruefDaten = await lade('d/v.bin', 'arrayBuffer');
    const d = pruefDaten;
    const klar = await schritt('Entschlüsseln', FRIST_SCHLUESSEL, () => Promise.resolve().then(() => crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: new Uint8Array(d, 0, 12), additionalData: new TextEncoder().encode('v') },
      schluessel, new Uint8Array(d, 12))).catch(() => null));        // falscher Schlüssel: kein Fehler, nur "falsch"
    return !!klar && new TextDecoder().decode(klar) === 'spiel-ok';
  };
  // PBKDF2 läuft in WebCrypto asynchron (blockiert die Seite nicht).
  const leite = (passwort, k) => schritt('Schlüssel ableiten (PBKDF2)', FRIST_SCHLUESSEL, async () => {
    const basis = await crypto.subtle.importKey('raw', new TextEncoder().encode(passwort.trim().normalize('NFC')),
      'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(k.salt), iterations: k.iter },
      basis, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  });

  // --- Rücksprungzähler: kein endloses Hin und Her zwischen Passwortseite und Spiel ---
  // 404.html und der Service Worker (ohne Schlüssel) schicken mit ?zurueck hierher zurück.
  // Kommt das Spiel so mehrmals kurz hintereinander zurück, liefert der Service Worker es
  // offenbar nicht aus: dann Hinweis statt erneutem Sprung.
  const ZURUECK = 'spiel-zurueck', ZURUECK_FENSTER = 60000, ZURUECK_MAX = 2;
  const liesZurueck = () => {
    let w = null;
    try { w = sessionStorage.getItem(ZURUECK); } catch (e) {}
    if (!w && window.name.indexOf(ZURUECK + '=') === 0) w = window.name.slice(ZURUECK.length + 1);
    try { const s = JSON.parse(w); if (s && Date.now() - s.t < ZURUECK_FENSTER) return s.n; } catch (e) {}
    return 0;
  };
  const merkeZurueck = n => {
    const w = n ? JSON.stringify({ n, t: Date.now() }) : '';
    try { if (w) sessionStorage.setItem(ZURUECK, w); else sessionStorage.removeItem(ZURUECK); return; } catch (e) {}
    window.name = w && ZURUECK + '=' + w;
  };

  // --- Service Worker starten und ins Spiel wechseln ---
  const insSpiel = async () => {
    if (liesZurueck() >= ZURUECK_MAX) {
      merkeZurueck(0);                                    // nach Neuladen darf es noch einmal versuchen
      throw new Browserfehler('Weiterleitung im Kreis: Das Spiel kam ' + ZURUECK_MAX + '-mal sofort zurück (Service Worker liefert es nicht aus).');
    }
    const sw = navigator.serviceWorker, ende = Date.now() + FRIST_SW, rest = () => Math.max(1000, ende - Date.now());
    const reg = await schritt('Service Worker (Anmeldung)', rest(), () => sw.register('sw.js', { scope: './' }));
    const bereit = await schritt('Service Worker (Aktivierung)', rest(), () => sw.ready);
    const aktiv = bereit.active || reg.active;
    if (!aktiv) throw new Browserfehler('Service Worker: nicht aktiv');
    aktiv.postMessage({ typ: 'zugang-geaendert' });
    if (!sw.controller) {                                 // kurz auf clients.claim() warten (nicht zwingend:
      await new Promise(ok => {                           // Navigationen gehen an den aktiven Worker)
        sw.addEventListener('controllerchange', ok, { once: true });
        setTimeout(ok, 2000);
      });
    }
    location.replace('spiel/index.html');
  };

  let k = null;
  formular.addEventListener('submit', async ereignis => {
    ereignis.preventDefault();
    if (!k || knopf.disabled) return;
    const passwort = feld.value;
    if (!passwort.trim()) { setzeMeldung(TEXT.falsch); return; }
    knopf.disabled = true;
    setzeMeldung(TEXT.warten, true, true);
    try {
      const schluessel = await leite(passwort, k);
      if (!(await pruefe(schluessel))) { setzeMeldung(TEXT.falsch); feld.select(); return; }
      await speichere({ schluessel, salt: k.salt, zeit: Date.now() });
      await insSpiel();
    } catch (e) {
      if (e instanceof Netzfehler) { console.error(e); setzeMeldung(TEXT.netz); }
      else zeigeFehler(e);
    } finally {
      knopf.disabled = false;
    }
  });

  const start = async () => {
    try { k = await lade('k.json', 'json'); } catch (e) { nurStatus(TEXT.netz); return; }

    if (new URLSearchParams(location.search).has('abmelden')) {
      try { await loesche(); } catch (e) {}
      await meldeSW();
      history.replaceState(null, '', location.pathname);
      zeigeFormular(TEXT.vergessen, true);
      return;
    }

    const gespeichert = await lies();
    if (gespeichert && gespeichert.schluessel) {
      if (await pruefe(gespeichert.schluessel)) { await insSpiel(); return; }
      try { await loesche(); } catch (e) {}
      await meldeSW();
    }
    zeigeFormular();
  };

  const suche = new URLSearchParams(location.search);
  if (suche.has('zurueck')) {
    merkeZurueck(liesZurueck() + 1);
    suche.delete('zurueck');
    const rest = suche.toString();
    try { history.replaceState(null, '', location.pathname + (rest ? '?' + rest : '')); } catch (e) {}
  } else merkeZurueck(0);

  // Zuerst prüfen, ob der Browser alles kann, was das Spiel braucht (vor allem anderen).
  const fehlt = [];
  try { if (!window.isSecureContext) fehlt.push('sichere Verbindung'); } catch (e) { fehlt.push('sichere Verbindung'); }
  try { if (!(window.crypto && crypto.subtle)) fehlt.push('WebCrypto'); } catch (e) { fehlt.push('WebCrypto'); }
  try { if (!window.indexedDB) fehlt.push('IndexedDB'); } catch (e) { fehlt.push('IndexedDB'); }
  try { if (!navigator.serviceWorker) fehlt.push('Service Worker'); } catch (e) { fehlt.push('Service Worker'); }
  if (fehlt.length) zeigeKaputt('Es fehlt: ' + fehlt.join(', ') + '.');
  else start().catch(zeigeFehler);
})();
</script>
</body>
</html>
